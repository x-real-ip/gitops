---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-e9928ef9-da1b-4da2-96b6-da487bea629e
  annotations:
    # Never let ArgoCD delete this volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    pv.kubernetes.io/provisioned-by: csi.truenas.io
spec:
  storageClassName: truenas-ssd-nfs
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 50Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: home-automation
    name: pvc-truenas-nfs-dsmr-reader-backups
  csi:
    driver: csi.truenas.io
    fsType: ext4
    volumeHandle: ssd/containers/csi/nfs/pvc-e9928ef9-da1b-4da2-96b6-da487bea629e
    volumeAttributes:
      compression: "LZ4"
      datasetPath: "containers/csi/nfs"
      nfs.rootSquash: "false"
      nfsPath: "/mnt/ssd/containers/csi/nfs/pvc-e9928ef9-da1b-4da2-96b6-da487bea629e"
      nfsServer: "truenas-a.lan.stamx.nl"
      pool: "ssd"
      protocol: "nfs"
