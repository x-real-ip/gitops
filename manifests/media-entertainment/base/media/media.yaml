---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-truenas-hdd-nfs-plex-media
  namespace: media
  annotations:
    # Never let ArgoCD delete this volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: truenas-hdd-nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
