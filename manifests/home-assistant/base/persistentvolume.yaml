    namespace: home-automation
    name: pvc-truenas-nfs-home-assistant-config
  csi:
    driver: csi.truenas.io
    fsType: ext4
    volumeHandle: ssd/containers/csi/nfs/pvc-f24c3404-5d80-4c9d-9fed-ba3e0dc61409
    volumeAttributes:
      compression: "LZ4"
      datasetPath: "containers/csi/nfs"
      nfs.rootSquash: "false"
      nfsPath: "/mnt/ssd/containers/csi/nfs/pvc-f24c3404-5d80-4c9d-9fed-ba3e0dc61409"
      nfsServer: "truenas-a.lan.stamx.nl"
      pool: "ssd"
      protocol: "nfs"
