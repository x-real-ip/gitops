---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-nfs-paperless-consume
  labels:
    app: paperless
spec:
  storageClassName: freenas-nfs-manual-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: pv-nfs-paperless-consume

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-truenas-nfs-paperless-data
  labels:
    app: paperless
  annotations:
    # Never let ArgoCD delete this volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: truenas-ssd-nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi

