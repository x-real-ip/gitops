---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-nfs-webdav-server-data
  namespace: tools
  labels:
    app: webdav
spec:
  storageClassName: freenas-nfs-manual-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 600Gi
  volumeName: pv-nfs-webdav-server-data

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-truenas-hdd-nfs-webdav
  labels:
    app: webdav
  annotations:
    # Shared by webdav-server, syncthing and paperless (consume subPath).
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: truenas-hdd-nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 400Gi
