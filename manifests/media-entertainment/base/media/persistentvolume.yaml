---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-1d90ffef-00e7-4a74-a7c2-2c67de2eb993
  annotations:
    # Never let ArgoCD delete this volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    pv.kubernetes.io/provisioned-by: csi.truenas.io
spec:
  storageClassName: truenas-hdd-nfs
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Ti
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: media
    name: pvc-truenas-hdd-nfs-plex-media
  csi:
    driver: csi.truenas.io
    fsType: ext4
    volumeHandle: hdd/containers/csi/nfs/pvc-1d90ffef-00e7-4a74-a7c2-2c67de2eb993
    volumeAttributes:
      compression: "LZ4"
      datasetPath: "containers/csi/nfs"
      nfs.rootSquash: "false"
      nfsPath: "/mnt/hdd/containers/csi/nfs/pvc-1d90ffef-00e7-4a74-a7c2-2c67de2eb993"
      nfsServer: "truenas-a.lan.stamx.nl"
      pool: "hdd"
      protocol: "nfs"
