---
kind: SealedSecret
apiVersion: bitnami.com/v1alpha1
metadata:
  name: immich-secret-env
  namespace: tools
  labels:
    app: immich
spec:
  encryptedData:
    DB_PASSWORD: 
  template:
    type: Opaque
    metadata:
      labels:
        app: immich
      name: immich-secret-env
      namespace: tools

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  labels:
    app: immich-server
  name: immich-config
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
spec:
  encryptedData:
    notifications_smtp_from: 
    notifications_smtp_transport_password: 
    notifications_smtp_transport_username: 
  template:
    data:
      immich-config.yaml: |
        backup:
          database:
            cronExpression: 0 02 * * *
            enabled: true
            keepLastAmount: 14
        ffmpeg:
          accel: disabled
          accelDecode: true
          acceptedAudioCodecs:
          - aac
          - mp3
          - opus
          acceptedContainers:
          - mov
          - ogg
          - webm
          acceptedVideoCodecs:
          - h264
          bframes: -1
          cqMode: auto
          crf: 23
          gopSize: 0
          maxBitrate: '0'
          preferredHwDevice: auto
          preset: ultrafast
          realtime:
            enabled: false
            resolutions:
            - 480
            - 720
            - 1080
            videoCodecs:
            - h264
            - hevc
          refs: 0
          targetAudioCodec: aac
          targetResolution: '720'
          targetVideoCodec: h264
          temporalAQ: false
          threads: 0
          tonemap: hable
          transcode: required
          twoPass: false
        image:
          colorspace: p3
          extractEmbedded: false
          fullsize:
            enabled: false
            format: jpeg
            progressive: false
            quality: 80
          preview:
            format: jpeg
            progressive: false
            quality: 80
            size: 1440
          thumbnail:
            format: webp
            progressive: false
            quality: 80
            size: 250
        integrityChecks:
          checksumFiles:
            cronExpression: 0 03 * * *
            enabled: true
            percentageLimit: 1
            timeLimit: 3600000
          missingFiles:
            cronExpression: 0 03 * * *
            enabled: true
          untrackedFiles:
            cronExpression: 0 03 * * *
            enabled: true
        job:
          backgroundTask:
            concurrency: 5
          editor:
            concurrency: 2
          faceDetection:
            concurrency: 2
          integrityCheck:
            concurrency: 1
          library:
            concurrency: 1
          metadataExtraction:
            concurrency: 1
          migration:
            concurrency: 1
          notifications:
            concurrency: 5
          ocr:
            concurrency: 1
          search:
            concurrency: 5
          sidecar:
            concurrency: 1
          smartSearch:
            concurrency: 2
          thumbnailGeneration:
            concurrency: 1
          videoConversion:
            concurrency: 1
          workflow:
            concurrency: 5
        library:
          scan:
            cronExpression: 0 0 * * *
            enabled: true
          watch:
            enabled: false
        logging:
          enabled: true
          level: log
        machineLearning:
          availabilityChecks:
            enabled: true
            interval: 30000
            timeout: 2000
          clip:
            enabled: true
            modelName: ViT-B-32__openai
          duplicateDetection:
            enabled: true
            maxDistance: 0.01
          enabled: true
          facialRecognition:
            enabled: true
            maxDistance: 0.5
            minFaces: 3
            minScore: 0.7
            modelName: buffalo_l
          ocr:
            enabled: true
            maxResolution: 736
            minDetectionScore: 0.5
            minRecognitionScore: 0.8
            modelName: PP-OCRv5_mobile
          urls:
          - http://immich-machine-learning:3003
        map:
          darkStyle: https://tiles.immich.cloud/v1/style/dark.json
          enabled: true
          lightStyle: https://tiles.immich.cloud/v1/style/light.json
        metadata:
          faces:
            import: false
        newVersionCheck:
          channel: stable
          enabled: true
        nightlyTasks:
          clusterNewFaces: true
          databaseCleanup: true
          generateMemories: true
          missingThumbnails: true
          startTime: 00:00
          syncQuotaUsage: true
        notifications:
          smtp:
            enabled: true
            from: '{{ index . "notifications_smtp_from" }}'
            replyTo: ''
            transport:
              host: smtp.protonmail.ch
              ignoreCert: false
              password: '{{ index . "notifications_smtp_transport_password" }}'
              port: 587
              secure: true
              username: '{{ index . "notifications_smtp_transport_username" }}'
        oauth:
          allowInsecureRequests: false
          autoLaunch: false
          autoRegister: true
          buttonText: Login with OAuth
          clientId: ''
          clientSecret: ''
          defaultStorageQuota: null
          enabled: false
          endSessionEndpoint: ''
          issuerUrl: ''
          mobileOverrideEnabled: false
          mobileRedirectUri: ''
          profileSigningAlgorithm: none
          prompt: ''
          roleClaim: immich_role
          scope: openid email profile
          signingAlgorithm: RS256
          storageLabelClaim: preferred_username
          storageQuotaClaim: immich_quota
          timeout: 30000
          tokenEndpointAuthMethod: client_secret_post
        passwordLogin:
          enabled: true
        reverseGeocoding:
          enabled: true
        server:
          externalDomain: ''
          loginPageMessage: ''
          publicUsers: true
        storageTemplate:
          enabled: true
          hashVerificationEnabled: true
          template: '{{ "{{y}}/{{MM}}/{{y}}{{MM}}{{dd}}_{{H}}{{mm}}{{ss}}_{{filetype}}_{{filename}}" }}'
        templates:
          email:
            albumInviteTemplate: ''
            albumUpdateTemplate: ''
            welcomeTemplate: ''
        theme:
          customCss: ''
        trash:
          days: 30
          enabled: true
        user:
          deleteDelay: 7
