    fsType: xfs
    volumeHandle: ssd/containers/csi/iscsi/pvc-aabba1dc-87a4-49a2-8a4e-6f5fe75fc737
    volumeAttributes:
      compression: "LZ4"
      datasetPath: "containers/csi/iscsi"
      fsType: "xfs"
      lun: "0"
      pool: "ssd"
      protocol: "iscsi"
      sparse: "true"
      targetIQN: "iqn.2005-10.org.freenas.ctl:csi-ssd-containers-csi-iscsi-pvc-aabba1dc-87a4-49a2-8a4e-6f5fe75fc737"
      targetPortal: "truenas-a.lan.stamx.nl:3260"
