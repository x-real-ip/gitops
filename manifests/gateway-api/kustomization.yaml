---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gateway API CRDs (experimental channel, required for TCPRoute/UDPRoute).
# Keep the version in sync with what nginx-gateway-fabric supports:
# https://github.com/nginx/nginx-gateway-fabric/blob/main/config/crd/gateway-api/experimental/kustomization.yaml
resources:
  - https://github.com/kubernetes-sigs/gateway-api/config/crd/experimental?timeout=120&ref=v1.6.3

# Never let ArgoCD remove these CRDs: deleting them removes every route in the cluster.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false,Delete=false
