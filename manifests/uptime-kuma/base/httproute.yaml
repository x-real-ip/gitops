---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-kuma
  labels:
    gateway: private
    app: uptime-kuma
spec:
  hostnames:
    - uptime-kuma.lan.stamx.nl
  parentRefs:
    - name: private
      namespace: gateway-private
      sectionName: https
  rules:
    - backendRefs:
        - name: uptime-kuma
          port: 3001
