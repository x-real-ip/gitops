---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gateway API CRDs are managed by the separate gateway-api app (manifests/gateway-api).
resources:
  - https://raw.githubusercontent.com/nginx/nginx-gateway-fabric/v2.8.1/deploy/crds.yaml
  - https://raw.githubusercontent.com/nginx/nginx-gateway-fabric/v2.8.1/deploy/experimental/deploy.yaml

patches:
  - target:
      group: batch
      version: v1
      kind: Job
      name: nginx-gateway-cert-generator
    patch: |-
      - op: remove
        path: /spec/ttlSecondsAfterFinished
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Force=true,Replace=true
