---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: depart-db
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    storageClass: truenas-ssd-iscsi
    size: 5Gi
  bootstrap:
    initdb:
      database: depart
      owner: depart
      secret:
        name: depart-db-credentials
  managed:
    roles:
      - name: depart
        ensure: present
        login: true
        passwordSecret:
          name: depart-db-credentials
