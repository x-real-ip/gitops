---
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-family-finance-config
  labels:
    app: open-family-finance
data:
  BACKEND_URL: "http://localhost:8080"
  PORT: "8080"
  LANGUAGE: "nl"
  APP_TITLE: "Financiën"
  PAPERLESS_ENABLED: "true"
  PAPERLESS_URL: "http://paperless.tools.svc.cluster.local:8000"
  PAPERLESS_PUBLIC_URL: "https://paperless.lan.stamx.nl"
  # Transfer-change notifications (e-mail via Proton SMTP, same account as vaultwarden)
  TIMEZONE: "Europe/Amsterdam"
  APP_URL: "https://geldzaken.lan.stamx.nl"
  SMTP_HOST: "smtp.protonmail.ch"
  SMTP_PORT: "587"
  SMTP_SECURITY: "starttls"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-family-finance-postgresql-env
  labels:
    app: open-family-finance
data:
  POSTGRES_DB: "openfamilyfinance"
  POSTGRES_USER: "openfamilyfinance"
