---
kind: SealedSecret
apiVersion: bitnami.com/v1alpha1
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: node-red-credential-secret
spec:
  encryptedData:
    NODE_RED_CREDENTIAL_SECRET: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      labels:
        app: node-red
      name: node-red-credential-secret
    type: Opaque
---
kind: SealedSecret
apiVersion: bitnami.com/v1alpha1
metadata:
  name: spotify-api-credentials
  labels:
    app: node-red
spec:
  encryptedData:
    SPOTIFY_API_CLIENT_ID: 
    SPOTIFY_API_CLIENT_SECRET: 
  template:
    metadata:
      labels:
        app: node-red
      name: spotify-api-credentials
    type: Opaque
