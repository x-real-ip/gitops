---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dsmr-reader-db
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    storageClass: truenas-ssd-iscsi
    size: 10Gi
  bootstrap:
    initdb:
      database: dsmrreader
      owner: dsmrreader
      secret:
        name: dsmr-reader-db-credentials
      import:
        type: microservice
        databases:
          - dsmrreader
        source:
          externalCluster: old-db
  externalClusters:
    - name: old-db
      connectionParameters:
        host: dsmr-reader-postgresql-hl
        user: dsmrreader
        dbname: dsmrreader
        sslmode: disable
      password:
        name: dsmr-reader
        key: POSTGRES_PASSWORD
  managed:
    roles:
      - name: dsmrreader
        ensure: present
        login: true
        passwordSecret:
          name: dsmr-reader-db-credentials
