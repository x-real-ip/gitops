---
kind: SealedSecret
apiVersion: bitnami.com/v1alpha1
metadata:
  name: immich-secret-env
  namespace: tools
  labels:
    app: immich
spec:
  encryptedData:
    DB_PASSWORD: 
  template:
    type: Opaque
    metadata:
      labels:
        app: immich
      name: immich-secret-env
      namespace: tools

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  labels:
    app: immich-server
  name: immich-config
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
spec:
  encryptedData:
    notifications_smtp_from: 
    notifications_smtp_transport_password: 
    notifications_smtp_transport_username: 
  template:
    data:
      immich-config.yaml: |
        notifications:
          smtp:
            enabled: true
            from: "{{ index . 'notifications_smtp_from' }}"
            replyTo: ''
            transport:
              host: smtp.protonmail.ch
              ignoreCert: true
              password: "{{ index . 'notifications_smtp_transport_password' }}"
              port: 587
              username: "{{ index . 'notifications_smtp_transport_username' }}"
