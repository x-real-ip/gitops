---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: open-family-finance-db
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    storageClass: truenas-ssd-iscsi
    size: 5Gi
  bootstrap:
    initdb:
      database: openfamilyfinance
      owner: openfamilyfinance
      secret:
        name: open-family-finance-db-credentials
  managed:
    roles:
      - name: openfamilyfinance
        ensure: present
        login: true
        passwordSecret:
          name: open-family-finance-db-credentials
