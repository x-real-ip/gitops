---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-truenas-nfs-paperless-data
  labels:
    app: paperless
  annotations:
    # Never let ArgoCD delete this volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  volumeName: pvc-9fe01bba-b2e4-457b-814a-94e2d0927bd0
  storageClassName: truenas-ssd-nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi

