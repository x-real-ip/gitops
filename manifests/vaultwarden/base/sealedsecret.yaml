---
kind: SealedSecret
apiVersion: bitnami.com/v1alpha1
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: vaultwarden-server-env-secret
spec:
  encryptedData:
    ADMIN_TOKEN: 
    DATABASE_URL: 
    SMTP_FROM: 
    SMTP_PASSWORD: 
    SMTP_USERNAME: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      labels:
        app: vaultwarden
      name: vaultwarden-server-env-secret
    type: Opaque

---
kind: SealedSecret
apiVersion: bitnami.com/v1alpha1
metadata:
  name: vaultwarden-database-env-secret
spec:
  encryptedData:
    POSTGRESQL_PASSWORD: 
    POSTGRESQL_USERNAME: 
  template:
    type: Opaque
    metadata:
      name: vaultwarden-database-env-secret
      labels:
        app: vaultwarden-database
