---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
spec:
  gatewayClassName: nginx
  infrastructure:
    annotations:
      metallb.io/loadBalancerIPs: 10.33.33.200
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: tls-wildcard-stamx-nl
            kind: Secret
            group: ""
