apiVersion: apps/v1
kind: Deployment
metadata:
  name: p1-relay
  labels:
    app.kubernetes.io/name: p1-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: p1-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p1-relay
    spec:
      containers:
        - name: p1-relay
          image: ghcr.io/OWNER/p1-relay:latest
          ports:
            - name: p1-stream
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 9090
              protocol: TCP
          env:
            - name: UPSTREAM_HOST
              value: "slimmelezer.lan.stamx.nl"
            - name: UPSTREAM_PORT
              value: "23"
            - name: LISTEN_ADDR
              value: ":8888"
            - name: HEALTH_ADDR
              value: ":9090"
            - name: RECONNECT_DELAY_SECONDS
              value: "2"
            - name: RECONNECT_MAX_DELAY_SECONDS
              value: "60"
            - name: UPSTREAM_IDLE_TIMEOUT_SECONDS
              value: "90"
            - name: HEALTH_STALE_SECONDS
              value: "120"
            - name: CLIENT_BUFFER_CHUNKS
              value: "256"
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
