---
# Hangt aan de private gateway, net als open-family-finance. De app is daarmee
# alleen binnen het eigen netwerk bereikbaar — er staan paspoortscans in.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: depart
  labels:
    app: depart
spec:
  hostnames:
    - vakantie.lan.stamx.nl
  parentRefs:
    - name: private
      namespace: gateway-private
      sectionName: https
  rules:
    - backendRefs:
        - name: depart-web
          port: 80
