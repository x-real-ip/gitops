---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-885af70a-8a24-421d-be1c-be7ec65fda59
  annotations:
    # Never let ArgoCD delete this volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    pv.kubernetes.io/provisioned-by: csi.truenas.io
spec:
  storageClassName: truenas-hdd-nfs
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 400Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: tools
    name: pvc-truenas-hdd-nfs-webdav
  csi:
    driver: csi.truenas.io
    fsType: ext4
    volumeHandle: hdd/containers/csi/nfs/pvc-885af70a-8a24-421d-be1c-be7ec65fda59
    volumeAttributes:
      compression: "LZ4"
      datasetPath: "containers/csi/nfs"
      nfs.rootSquash: "false"
      nfsPath: "/mnt/hdd/containers/csi/nfs/pvc-885af70a-8a24-421d-be1c-be7ec65fda59"
      nfsServer: "truenas-a.lan.stamx.nl"
      pool: "hdd"
      protocol: "nfs"
