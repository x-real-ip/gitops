---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: timelimit-secrets
  labels:
    app: timelimit
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
spec:
  encryptedData:
    # Placeholders - geen echte ciphertext. Verzegel deze zelf met kubeseal
    # voor secret "timelimit-secrets" in namespace "tools", zie README.md.
    #
    # DB_PASS moet exact hetzelfde wachtwoord zijn als POSTGRES_PASSWORD in
    # timelimit-postgresql-secret. Gebruik alleen letters en cijfers: de
    # server plakt DB_PASS ongecodeerd in een connectie-URL.
    DB_PASS: "CHANGEME_run_kubeseal_for_timelimit_in_namespace_tools"
    ADMIN_TOKEN: "CHANGEME_run_kubeseal_for_timelimit_in_namespace_tools"
    SIGN_SECRET: "CHANGEME_run_kubeseal_for_timelimit_in_namespace_tools"
  template:
    type: Opaque
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
        sealedsecrets.bitnami.com/cluster-wide: "true"
      labels:
        app: timelimit
      name: timelimit-secrets
