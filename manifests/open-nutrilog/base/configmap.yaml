---
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-nutrilog-config
  labels:
    app: open-nutrilog
data:
  PORT: "8080"
  LOG_LEVEL: "info"
  APP_URL: "https://nutrilog.lan.stamx.nl"
  # What "a day" is in the diary; the profile can override it.
  TZ: "Europe/Amsterdam"
  # The migrate init container runs the migrations; the app doesn't.
  MIGRATE_ON_START: "false"
  # password until Authentik is set up; then oidc (needs OIDC_CLIENT_ID below
  # and OIDC_CLIENT_SECRET in open-nutrilog-secrets, and ConfigMap stamx-ca).
  AUTH_MODE: "password"
  OIDC_ISSUER_URL: "https://auth.lan.stamx.nl/application/o/open-nutrilog/"
  # Placeholder until the Authentik provider exists.
  OIDC_CLIENT_ID: "open-nutrilog"
  # The link with Open Strength (tokens in open-nutrilog-secrets). Remove to unlink.
  STRENGTH_URL: "http://open-strength.tools.svc.cluster.local"
