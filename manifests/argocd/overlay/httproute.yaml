---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  labels:
    app.kubernetes.io/name: argocd-server
spec:
  hostnames:
    - argocd.lan.stamx.nl
  parentRefs:
    - name: private
      namespace: gateway-private
      sectionName: https
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
