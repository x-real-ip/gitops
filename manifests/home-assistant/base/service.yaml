---
kind: Service
apiVersion: v1
metadata:
  name: home-assistant
  labels:
    app: home-assistant
spec:
  selector:
    app: home-assistant
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8123
    - name: coiot
      protocol: UDP
      port: 5683
      targetPort: 5683
