---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-truenas-iscsi-frigate-config
  labels:
    app: frigate
  annotations:
    # Never let ArgoCD delete this volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  volumeName: pvc-c31ff62f-a840-4b67-8253-89dd3cb02fab
  storageClassName: truenas-ssd-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-truenas-hdd-nfs-frigate-media
  labels:
    app: frigate
  annotations:
    # Never let ArgoCD delete this volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  volumeName: pvc-9c6a5d2f-195a-4831-8b39-4bc47ccf05f0
  storageClassName: truenas-hdd-nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
