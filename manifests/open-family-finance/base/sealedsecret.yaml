---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: open-family-finance-secrets
spec:
  encryptedData:
    API_TOKEN: 
    DATABASE_URL: 
    PAPERLESS_API_TOKEN: 
    POSTGRES_PASSWORD: 
    SMTP_FROM: 
    SMTP_PASS: 
    SMTP_USER: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      labels:
        app: open-family-finance
      name: open-family-finance-secrets
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: open-family-finance-db-credentials
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: open-family-finance-db-credentials
    type: kubernetes.io/basic-auth
