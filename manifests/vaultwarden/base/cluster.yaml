---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vaultwarden-db
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    storageClass: truenas-ssd-iscsi
    size: 5Gi
  bootstrap:
    initdb:
      database: vaultwarden
      owner: vaultwarden
      secret:
        name: vaultwarden-db-credentials
      import:
        type: microservice
        databases:
          - vaultwarden
        source:
          externalCluster: old-db
  externalClusters:
    - name: old-db
      connectionParameters:
        host: vaultwarden-postgresql-hl
        user: vaultwarden
        dbname: vaultwarden
        sslmode: disable
      password:
        name: vaultwarden-database-env-secret
        key: POSTGRESQL_PASSWORD
  managed:
    roles:
      - name: vaultwarden
        ensure: present
        login: true
        passwordSecret:
          name: vaultwarden-db-credentials
