---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hergebruikt de gedeelde postgres-base, hetzelfde patroon als authentik.
resources:
  - ../../../postgres/base

namePrefix: depart-

labels:
  - includeSelectors: true
    pairs:
      app-instance: depart-postgresql

patches:
  - target:
      kind: ConfigMap
      name: postgresql-env
    patch: |-
      - op: replace
        path: /data/POSTGRES_DB
        value: depart
      - op: replace
        path: /data/POSTGRES_USER
        value: depart
  - target:
      kind: StatefulSet
      name: postgresql
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/volumeName
        value: depart-pv-iscsi-postgresql-db
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/name
        value: depart-postgresql-secret
  - target:
      kind: SealedSecret
      name: postgresql-secret
    patch: |-
      - op: replace
        path: /spec/template/metadata/name
        value: depart-postgresql-secret
      - op: replace
        path: /spec/encryptedData/POSTGRES_PASSWORD
        value: 
  - target:
      kind: PersistentVolume
      name: pv-iscsi-postgresql-db
    patch: |-
      - op: replace
        path: /spec/capacity/storage
        value: 5Gi
      - op: replace
        path: /spec/csi/volumeAttributes/iqn
        value: "iqn.2005-10.org.freenas.ctl:depart-db"
