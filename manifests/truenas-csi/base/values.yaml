# TrueNAS appliance connection.
truenas:
  # WebSocket URL of the TrueNAS API. Required.
  url: "wss://truenas-a.lan.stamx.nl"
  # Default ZFS pool for volumes. Required.
  defaultPool: "ssd"
  # Skip TLS verification. Needed for the self-signed certificate TrueNAS ships
  # with; leaving it false against that certificate stops the driver at startup
  # with a certificate error.
  insecureSkipTLS: true

  # Name of a Secret you manage instead, for example one produced by
  # ExternalSecrets or Sealed Secrets. Any Secret type works.
  existingSecret: truenas-csi-api-key
  # Key inside existingSecret that holds the API key.
  existingSecretKey: api-key

controller:
  resources:
    limits:
      cpu: null

node:
  resources:
    limits:
      cpu: null

# StorageClasses to create. parameters are passed to the driver verbatim; see
# the StorageClass parameter reference in the README.
# Example:
#   storageClasses:
#     - name: truenas-nfs
#       isDefault: true
#       reclaimPolicy: Delete
#       allowVolumeExpansion: true
#       volumeBindingMode: Immediate
#       mountOptions: []
#       parameters:
#         protocol: nfs
#         compression: LZ4
storageClasses:
  - name: truenas-ssd-iscsi
    isDefault: false
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      protocol: iscsi
      pool: ssd
      datasetPath: containers/csi/iscsi
      fsType: xfs
      compression: LZ4
      sparse: "true"

  - name: truenas-ssd-nfs
    isDefault: false
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      protocol: nfs
      pool: ssd
      datasetPath: containers/csi/nfs
      compression: LZ4
      nfs.rootSquash: "false"

  - name: truenas-hdd-nfs
    isDefault: false
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      protocol: nfs
      pool: hdd
      datasetPath: containers/csi/nfs
      compression: LZ4
      nfs.rootSquash: "false"

volumeSnapshotClass:
  enabled: false

# Extra manifests to install with the chart, rendered as templates. Useful for
# an ExternalSecret that produces truenas.existingSecret.
extraObjects:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: truenas-csi-api-key
    spec:
      encryptedData:
        api-key: 
      template:
        metadata:
          annotations:
            sealedsecrets.bitnami.com/cluster-wide: "true"
          name: truenas-csi-api-key
        type: Opaque
