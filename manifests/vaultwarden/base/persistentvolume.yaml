    fsType: ext4
    volumeHandle: ssd/containers/csi/nfs/pvc-9695ecf4-790e-4376-940a-ab43ebdb3e6b
    volumeAttributes:
      compression: "LZ4"
      datasetPath: "containers/csi/nfs"
      nfs.rootSquash: "false"
      nfsPath: "/mnt/ssd/containers/csi/nfs/pvc-9695ecf4-790e-4376-940a-ab43ebdb3e6b"
      nfsServer: "truenas-a.lan.stamx.nl"
