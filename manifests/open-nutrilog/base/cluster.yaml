---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: open-nutrilog-db
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    storageClass: truenas-ssd-iscsi
    size: 5Gi
  bootstrap:
    initdb:
      database: open_nutrilog
      owner: open_nutrilog
      secret:
        name: open-nutrilog-db-credentials
  managed:
    roles:
      - name: open_nutrilog
        ensure: present
        login: true
        passwordSecret:
          name: open-nutrilog-db-credentials
